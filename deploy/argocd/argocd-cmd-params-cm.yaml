# Serve the Argo CD UI over plain HTTP inside the cluster; TLS terminates at
# Cloudflare when it's exposed at argocd.nirvek.xyz through the tunnel.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
