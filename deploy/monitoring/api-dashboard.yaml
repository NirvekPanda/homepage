# Grafana dashboard comparing request traffic for the homepage and the travel
# image API. Both sit behind k3s's Traefik, so the Traefik PodMonitor already
# collects their metrics; the Traefik `service` label (<namespace>-<svc>-<port>@kubernetes)
# tells them apart, so it doesn't matter that they live in different namespaces.
# The Grafana sidecar loads any ConfigMap labelled grafana_dashboard=1 in this namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-traffic-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  api-traffic.json: |
    {
      "uid": "api-traffic",
      "title": "API Traffic: homepage + travel-image-api",
      "tags": ["traefik", "homelab"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "prometheus" }
          },
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": { "query": "label_values(traefik_service_requests_total, service)", "refId": "service" },
            "regex": "/^(homepage|travel-image-api)-.*/",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Requests (last 24h)",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (increase(traefik_service_requests_total{service=~\"$service\"}[24h]))",
              "legendFormat": "{{service}}",
              "instant": true
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "none" }
        },
        {
          "id": 2,
          "title": "Request rate by service",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(traefik_service_requests_total{service=~\"$service\"}[$__rate_interval]))",
              "legendFormat": "{{service}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 3,
          "title": "5xx error ratio by service",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(traefik_service_requests_total{service=~\"$service\", code=~\"5..\"}[$__rate_interval])) / sum by (service) (rate(traefik_service_requests_total{service=~\"$service\"}[$__rate_interval]))",
              "legendFormat": "{{service}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0 } }
        },
        {
          "id": 4,
          "title": "p95 latency by service",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(traefik_service_request_duration_seconds_bucket{service=~\"$service\"}[$__rate_interval])))",
              "legendFormat": "{{service}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 5,
          "title": "Requests by status code",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service, code) (rate(traefik_service_requests_total{service=~\"$service\"}[$__rate_interval]))",
              "legendFormat": "{{service}} {{code}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "stacking": { "mode": "normal" }, "fillOpacity": 20 } } }
        }
      ]
    }
