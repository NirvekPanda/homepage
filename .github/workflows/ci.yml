name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase
  IMAGE_NAME: ghcr.io/nirvekpanda/frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # TODO: integration suites are stale vs. the current components; make
      # this blocking (drop continue-on-error) once they're fixed
      - name: Integration tests
        run: npm run test:integration
        continue-on-error: true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<short> is the immutable tag CD will pin to; latest is a convenience
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # PRs only prove the image builds; pushes to main publish it
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

  # Point deploy/k8s at the image just pushed, so Argo CD deploys it. main only
  # accepts changes through PRs (safe-main ruleset), so this opens a PR and merges
  # it straight away. Merges made with GITHUB_TOKEN don't trigger workflows, so
  # this can't loop.
  bump-manifest:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # one at a time, so two quick merges can't race on the same line
    concurrency:
      group: bump-manifest
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # main's current head, not the commit that triggered this run
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Open and merge the tag bump PR
        run: |
          tag="sha-${GITHUB_SHA::7}"
          sed -i "s/^\( *newTag:\).*/\1 ${tag}/" deploy/k8s/kustomization.yaml
          if git diff --quiet; then
            echo "deploy/k8s already on ${tag}"
            exit 0
          fi
          branch="deploy/frontend-${tag}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "deploy: frontend ${tag}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "deploy: frontend ${tag}" \
            --body "Automated: points deploy/k8s at the image built from ${GITHUB_SHA}."
          gh pr merge "$branch" --squash --delete-branch
